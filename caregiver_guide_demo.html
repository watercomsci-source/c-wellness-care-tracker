                  <div class="inline-block animate-spin text-emerald-400 text-base">🔄</div>
                  <p class="text-xs font-bold">กำลังบันทึก...</p>
                  <p class="text-[10px] text-slate-300">กรุณารอสักครู่ ระบบกำลังบันทึกข้อมูลและส่งแจ้งเตือน LINE...</p>
                </div>

                <!-- กล่องสำเร็จ -->
                <div class="bg-emerald-500 text-white p-2.5 rounded-xl text-center text-xs font-bold shadow-md">
                  ✅ บันทึกเรียบร้อย แจ้งเตือนส่งเข้า LINE ญาติแล้ว
                </div>
              </div>
            </div>
          `;
        }
      },
      {
        chapter: "บทที่ 7: การดูประวัติรายงาน & การแก้ไขข้อมูล (ป็อปอับกำลังแก้ไข)",
        role: "พนักงานเฝ้าไข้",
        render: function() {
          return `
            <div class="space-y-3">
              <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl text-emerald-900">
                <p class="font-bold text-xs">📜 ขั้นตอนที่ 7: ประวัติรายงาน & การแก้ไข</p>
                <p class="text-[11px] text-emerald-700 mt-0.5">พนักงานใหม่จะเห็นประวัติเฉพาะคนไข้ที่ตนเองเคยรายงาน</p>
              </div>

              <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
                <div class="flex justify-between items-center text-xs">
                  <span class="font-bold text-slate-800">ไทม์ไลน์รายงานวันนี้</span>
                  <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-semibold">1 รายการ</span>
                </div>

                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-1 text-xs">
                  <div class="flex justify-between items-center">
                    <span class="font-bold text-slate-800">🌅 กะเช้า • คุณตาบุญมี มีสุข</span>
                    <span class="text-[10px] font-bold text-emerald-600 bg-emerald-100 px-1.5 py-0.5 rounded-full">ปกติ</span>
                  </div>
                  <p class="text-[11px] text-slate-500">BP: 124/82 | T: 36.8°C | อาการปกติ รับประทานอาหารได้ดี</p>
                  
                  <div class="flex justify-end gap-2 pt-1">
                    <button class="px-2.5 py-1 rounded-lg bg-slate-800 text-white text-[10px] font-semibold">
                      ✏️ แก้ไขรายงาน
                    </button>
                  </div>
                </div>

                <!-- ป็อปอับจำลองขณะกำลังแก้ไข -->
                <div class="bg-slate-900/80 p-2.5 rounded-2xl text-white text-center space-y-1 shadow-lg">
                  <div class="inline-block animate-spin text-amber-400 text-sm">🔄</div>
                  <p class="text-xs font-bold">กำลังแก้ไข...</p>
                  <p class="text-[10px] text-slate-300">ระบบกำลังอัปเดตข้อมูลการแก้ไขรายงานอาการ...</p>
                </div>
              </div>
            </div>
          `;
        }
      }
    ];

    let currentStep = 0;
    let isPlaying = false;
    let playTimer = null;

    function renderCurrentStep() {
      const data = stepsData[currentStep];
      document.getElementById("chapterTitle").textContent = data.chapter;
      document.getElementById("stepCounter").textContent = `ขั้นตอน ${currentStep + 1} / ${stepsData.length}`;
      document.getElementById("mockupRoleTag").textContent = data.role;
      document.getElementById("mockupBody").innerHTML = data.render();
      
      const pct = ((currentStep + 1) / stepsData.length) * 100;
      document.getElementById("progressBar").style.width = pct + "%";

      document.querySelectorAll(".step-btn").forEach((btn, idx) => {
        if (idx === currentStep) {
          btn.classList.add("step-active");
        } else {
          btn.classList.remove("step-active");
        }
      });
    }

    function goToStep(idx) {
      currentStep = Math.max(0, Math.min(stepsData.length - 1, idx));
      renderCurrentStep();
    }

    function nextStep() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
      } else {
        currentStep = 0;
      }
      renderCurrentStep();
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
      } else {
        currentStep = stepsData.length - 1;
      }
      renderCurrentStep();
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      const playIcon = document.getElementById("playIcon");
      const playText = document.getElementById("playText");
      const indicator = document.getElementById("playIndicator");

      if (isPlaying) {
        playIcon.textContent = "⏸️";
        playText.textContent = "หยุดชั่วคราว";
        indicator.classList.remove("hidden");
        playTimer = setInterval(() => {
          nextStep();
        }, 4000);
      } else {
        playIcon.textContent = "▶️";
        playText.textContent = "เล่นอัตโนมัติ";
        indicator.classList.add("hidden");
        if (playTimer) clearInterval(playTimer);
      }
    }

    function handleSeek(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      const targetStep = Math.floor(pct * stepsData.length);
      goToStep(targetStep);
    }

    // Init first step
    renderCurrentStep();
  </script>
</body>
</html>
